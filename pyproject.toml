[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-sqlite"
version = "0.2.1"
description = "SQLite memory storage with vector, keyword and FTS5 retrieval for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "typer>=0.9.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
homepage = "https://github.com/Jnocode/recall-memory"
repository = "https://github.com/Jnocode/recall-memory"

[project.scripts]
recall = "recall.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
